<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — EVGRID</title><link rel="stylesheet" href="/css/style.css"></head><body>
<main class="auth"><section class="auth-card card">
<div class="brand">EV<span>GRID</span></div><div class="eyebrow">SECURE ACCESS</div>
<h1>Welcome back</h1><p>Sign in to your EV control center.</p>
<form id="loginForm" class="form">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div>
<button class="btn btn-primary" type="submit">Sign In</button><div id="loginMessage" class="form-msg"></div>
</form><div class="auth-bottom">New to EVGRID? <a href="/register.html">Create an account</a></div>
</section></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
