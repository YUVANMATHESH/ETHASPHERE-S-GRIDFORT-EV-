<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — GRIDFORT EV</title><link rel="stylesheet" href="/css/style.css"></head><body>
<main class="auth"><section class="auth-card card">
<div class="brand">EV<span>GRID</span></div><div class="eyebrow">JOIN THE NETWORK</div>
<h1>Create account</h1><p>Register your GRIDFORT EV user account.</p>
<form id="registerForm" class="form">
<div class="field"><label for="name">Name</label><input id="name" type="text" placeholder="Your name" required></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" type="tel" placeholder="9876543210"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" placeholder="Minimum 6 characters" required></div>
<button class="btn btn-primary" type="submit">Create Account</button><div id="registerMessage" class="form-msg"></div>
</form><div class="auth-bottom">Already have an account? <a href="/login.html">Sign in</a></div>
</section></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
