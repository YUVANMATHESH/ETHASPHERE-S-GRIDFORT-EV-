<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — EVGRID</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="side-brand"><div class="brand">EV<span>GRID</span></div></div><nav class="nav"><a class="active" href="/admin.html">◉ Admin</a><a href="#stations">⚡ Stations</a><a href="#users">👥 Users</a><a href="#sessions">◒ Sessions</a><a href="#alerts">🚨 Alerts</a></nav><div class="side-bottom"><button class="btn btn-danger" style="width:100%" onclick="logout()">Logout</button></div></aside>
<main class="main"><div class="topbar"><div><h1>Admin Control Center</h1><p>Operate the EV network and inspect platform activity.</p></div><div class="userbox"><div id="avatar" class="avatar">A</div><span id="userName">Admin</span></div></div>
<div class="grid4"><div class="stat-card card"><div class="stat-label">Users</div><div id="usersCount" class="stat-value">—</div></div><div class="stat-card card"><div class="stat-label">Stations</div><div id="stationsCount" class="stat-value">—</div></div><div class="stat-card card"><div class="stat-label">Chargers</div><div id="chargersCount" class="stat-value">—</div></div><div class="stat-card card"><div class="stat-label">Unresolved Alerts</div><div id="alertsCount" class="stat-value">—</div></div></div>
<section id="stations" class="section"><div class="section-head"><h2>Stations</h2><button id="addStationBtn" class="btn btn-primary">+ Add Station</button></div><div id="stationsGrid" class="grid3"></div></section>
<section id="users" class="section"><div class="section-head"><h2>Users</h2></div><div class="table-wrap card" style="padding:8px"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody id="usersTable"></tbody></table></div></section>
<section id="sessions" class="section"><div class="section-head"><h2>Charging Sessions</h2></div><div class="table-wrap card" style="padding:8px"><table class="table"><thead><tr><th>Status</th><th>Energy</th><th>Cost</th><th>Start</th></tr></thead><tbody id="sessionsTable"></tbody></table></div></section>
<section id="alerts" class="section"><div class="section-head"><h2>Alerts</h2></div><div id="alertsList" class="alerts card" style="padding:12px"></div></section>
</main></div>
<div id="stationModal" class="modal"><div class="modal-card card"><div class="section-head"><h2>Add Station</h2><button class="btn btn-ghost" onclick="closeStationModal()">✕</button></div><form id="stationForm" class="form"><div class="field"><label>Name</label><input id="stationName" required placeholder="Central EV Hub"></div><div class="field"><label>Location</label><input id="stationLocation" required placeholder="Perundurai, Erode"></div><div class="field"><label>Total Chargers</label><input id="stationChargers" type="number" min="0" value="4"></div><button class="btn btn-primary">Create Station</button><div id="stationMessage" class="form-msg"></div></form></div></div>
<script src="/js/api.js"></script><script src="/js/admin.js"></script></body></html>
